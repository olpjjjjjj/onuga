<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>音声録音・リアルタイム文字起こし・PDF出力アプリ</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 1rem;
    background: #f9f9f9;
    color: #333;
  }
  h1 {
    text-align: center;
  }
  button {
    padding: 10px 15px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
  }
  #transcript {
    width: 100%;
    height: 200px;
    margin-top: 10px;
    font-size: 16px;
    padding: 10px;
    box-sizing: border-box;
    border-radius: 5px;
    border: 1px solid #ccc;
    resize: vertical;
  }
  #summary {
    margin-top: 10px;
    padding: 10px;
    background: #e0f0ff;
    border-radius: 5px;
    min-height: 80px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<h1>音声録音・リアルタイム文字起こし・PDF出力アプリ</h1>

<div>
  <button id="startBtn">録音開始</button>
  <button id="stopBtn" disabled>録音停止</button>
  <button id="exportPdfBtn" disabled>PDF出力</button>
  <button id="summarizeBtn" disabled>要約表示</button>
</div>

<textarea id="transcript" placeholder="ここに文字起こしが表示されます..." readonly></textarea>

<h2>要約</h2>
<div id="summary">ここに要約が表示されます。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  // Setup variables for speech recognition
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const exportPdfBtn = document.getElementById('exportPdfBtn');
  const summarizeBtn = document.getElementById('summarizeBtn');
  const transcriptArea = document.getElementById('transcript');
  const summaryDiv = document.getElementById('summary');

  let recognition;
  let isRecording = false;
  let finalTranscript = '';

  // Check for browser support
  window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition || null;

  if (!window.SpeechRecognition) {
    alert('このブラウザはSpeechRecognition APIをサポートしていません。Google Chromeでお試しください。');
    startBtn.disabled = true;
  } else {
    recognition = new window.SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.interimResults = true;
    recognition.continuous = true;

    recognition.onresult = (event) => {
      let interimTranscript = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalTranscript += transcript + '。';
        } else {
          interimTranscript += transcript;
        }
      }
      transcriptArea.value = finalTranscript + interimTranscript;
    };

    recognition.onerror = (event) => {
      console.error('音声認識エラー:', event.error);
      if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
        alert('マイクへのアクセスが拒否されました。設定を確認してください。');
        stopRecording();
      }
    };

    recognition.onend = () => {
      if (isRecording) {
        // Auto-restart recognition to keep continuous recognition
        recognition.start();
      }
    };
  }

  function startRecording() {
    if (!recognition) return;
    finalTranscript = '';
    transcriptArea.value = '';
    summaryDiv.textContent = 'ここに要約が表示されます。';
    recognition.start();
    isRecording = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    exportPdfBtn.disabled = true;
    summarizeBtn.disabled = true;
  }

  function stopRecording() {
    if (!recognition) return;
    isRecording = false;
    recognition.stop();
    startBtn.disabled = false;
    stopBtn.disabled = true;
    exportPdfBtn.disabled = finalTranscript.trim() === '';
    summarizeBtn.disabled = finalTranscript.trim() === '';
  }

  function exportPDF() {
    import('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js').then(({ jsPDF }) => {
      const doc = new jsPDF.jsPDF();
      const text = finalTranscript.trim() || transcriptArea.value.trim();
      const pageHeight = doc.internal.pageSize.getHeight();
      let margin = 10;
      let verticalOffset = margin;
      const lineHeight = 10;
      const splitText = doc.splitTextToSize(text, 180);
      for(let i = 0; i < splitText.length; i++) {
        if (verticalOffset + lineHeight > pageHeight - margin) {
          doc.addPage();
          verticalOffset = margin;
        }
        doc.text(splitText[i], margin, verticalOffset);
        verticalOffset += lineHeight;
      }
      doc.save('transcript.pdf');
    });
  }

  // Simple summarization function: extracts first 3 sentences or first 300 chars
  function summarizeText(text) {
    if(!text) return '要約するテキストがありません。';
    // 句点（。）で文章分割
    const sentences = text.split(/[。．\.]/).filter(s => s.trim().length > 0);
    if(sentences.length === 0){
      return text.length > 300 ? text.slice(0, 300) + '...' : text;
    }
    const summarySentences = sentences.slice(0,3);
    let summary = summarySentences.join('。') + '。';
    if(summary.length > 300){
      summary = summary.slice(0,300) + '...';
    }
    return summary;
  }

  startBtn.addEventListener('click', startRecording);
  stopBtn.addEventListener('click', stopRecording);
  exportPdfBtn.addEventListener('click', exportPDF);
  summarizeBtn.addEventListener('click', () => {
    summaryDiv.textContent = summarizeText(finalTranscript.trim() || transcriptArea.value.trim());
  });
</script>
</body>
</html>
